<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123e44"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Arabic"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Arabic · English Flashcards</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#153a3d;background:#eef3ef}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#123e44;color:white;padding:calc(env(safe-area-inset-top) + 22px) 20px 24px}header .wrap{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between}header h1{font-size:22px;margin:0}header small{opacity:.78}main{max-width:760px;margin:auto;padding:22px 16px calc(env(safe-area-inset-bottom) + 40px)}.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 6px 24px #123e4410;margin-bottom:16px}.muted{color:#6e8584}.small{font-size:13px}.eyebrow{letter-spacing:.08em;text-transform:uppercase;font-size:11px;font-weight:700;color:#608580}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.btn{border:0;border-radius:12px;padding:13px 16px;background:#126d70;color:white;font-weight:650;min-height:46px}.btn.secondary{background:#e9f2f0;color:#17585b}.btn.ghost{background:transparent;color:#126d70}.btn.danger{background:#fceceb;color:#a23c37}.btn:disabled{opacity:.45}.deck{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid #e1ece8;background:#fff;border-radius:15px;padding:17px}.deck strong{font-size:17px}.deck span{color:#6e8584;font-size:13px}.pill{display:inline-block;border-radius:99px;background:#e9f2f0;color:#24696a;padding:5px 10px;font-size:12px}.card{width:100%;min-height:275px;background:linear-gradient(150deg,#fff,#edf7f3);border:1px solid #d6e8e2;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;box-shadow:0 12px 24px #0c474615;text-align:center}.arabic{font-family:"Geeza Pro","Noto Naskh Arabic","Traditional Arabic",serif;font-size:clamp(34px,8vw,52px);line-height:1.85;direction:rtl;unicode-bidi:plaintext}.english{font-size:30px;font-weight:700;line-height:1.4}.card .hint{font-size:13px;color:#6c8883}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls>*{flex:1}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:650;font-size:14px}.field input,.field select,.field textarea{border:1px solid #cbded9;border-radius:11px;padding:12px;background:white;min-width:0;width:100%;color:#163c3d}.field textarea{min-height:80px}.progress{height:7px;background:#e2ece8;border-radius:99px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#19857b;transition:width .2s}.option{width:100%;text-align:center;border:1px solid #cfe2dc;border-radius:12px;padding:16px;background:white;color:#173c3d;min-height:58px}.option.correct{border-color:#22826a;background:#e4f5e9}.option.wrong{border-color:#c85454;background:#fce9e9}.option:disabled{opacity:1}.notice{padding:13px;border-radius:12px;background:#e8f4ed;margin-top:12px}.error{background:#fff0ed}.divider{border:0;border-top:1px solid #e1ebe7;margin:16px 0}.wordrow{border-bottom:1px solid #e8eeea;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.wordrow:last-child{border-bottom:0}.wordrow .arabic{font-size:25px;line-height:1.6}.stat{background:#eaf4f0;border-radius:14px;padding:14px;text-align:center}.stat strong{display:block;font-size:26px}.hidden{display:none!important}h2{margin:0 0 8px;font-size:24px}h3{margin:0 0 12px}p{line-height:1.55}footer{text-align:center;color:#708783;font-size:12px;padding:14px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#153e40;color:white;padding:12px 18px;border-radius:12px;z-index:20;display:none;max-width:90vw}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e8b96b;outline-offset:2px}@media(max-width:380px){.grid{grid-template-columns:1fr}.controls{flex-direction:column}}

/* Vintage-paper design applies only to Flip Cards. */
.card.flip-card{background:linear-gradient(155deg,#fff1cf 0%,#f8e7be 55%,#f3dfb3 100%);border:1px solid #c5a56c;color:#4b351e;box-shadow:0 10px 25px #78572b24,inset 0 1px 0 #fff6df;min-height:300px;gap:18px;transition:background .2s ease,border-color .2s ease}
.card.flip-card.flip-answer{background:linear-gradient(155deg,#fffaf0 0%,#fff5e2 55%,#ffefd2 100%);border-color:#e8d5ae}
.card.flip-card .russian,.card.flip-card .english{font-size:40px;font-weight:700;line-height:1.15;overflow-wrap:anywhere;max-width:100%;color:#4b351e}
.card.flip-card .arabic{font-size:clamp(51px,12vw,78px);line-height:1.8;max-width:100%;overflow-wrap:anywhere;color:#4b351e}
.card.flip-card .hint{color:#866a43;font-size:13px}
@media(max-width:390px){.card.flip-card{padding:18px}.card.flip-card .russian,.card.flip-card .english{font-size:clamp(25.33px,8.67vw,40px)}}

/* Match the existing Flip Cards paper palette in other study modes. */
.panel.paper-question{background:linear-gradient(155deg,#fff1cf 0%,#f8e7be 55%,#f3dfb3 100%);border:1px solid #c5a56c;color:#4b351e;box-shadow:0 10px 25px #78572b24,inset 0 1px 0 #fff6df}
.paper-question .english,.paper-question .arabic{color:#4b351e}
.paper-options .option{background:linear-gradient(155deg,#fffaf0 0%,#fff5e2 55%,#ffefd2 100%);border-color:#e8d5ae;color:#4b351e}
.paper-options .option.correct{background:#e4f5e9;border-color:#22826a}
.paper-options .option.wrong{background:#fce9e9;border-color:#c85454}
/* English-to-Arabic study typography; reverse direction stays unchanged. */
.paper-question.en-ar-question .russian{font-size:1.5em;line-height:1.4;overflow-wrap:anywhere}
.paper-options.en-ar-options .option .arabic{font-size:clamp(17px,4vw,26px);line-height:1.85}
</style></head><body><header><div class="wrap"><div><h1>العَرَبِيَّةُ <span style="font-size:15px">· Flashcards</span></h1><small>Learn a little every day</small></div><button class="btn secondary" id="homeBtn" aria-label="Home">⌂ Home</button></div></header><main id="app"></main><div id="toast" role="status"></div><script src="app.js" defer></script></body></html>

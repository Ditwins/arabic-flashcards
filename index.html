<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123e44"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Арабский"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Арабский — карточки</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#153a3d;background:#eef3ef}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#123e44;color:white;padding:calc(env(safe-area-inset-top) + 22px) 20px 24px}header .wrap{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between}header h1{font-size:22px;margin:0}header small{opacity:.78}main{max-width:760px;margin:auto;padding:22px 16px calc(env(safe-area-inset-bottom) + 40px)}.panel{background:white;border-radius:20px;padding:20px;box-shadow:0 6px 24px #123e4410;margin-bottom:16px}.muted{color:#6e8584}.small{font-size:13px}.eyebrow{letter-spacing:.08em;text-transform:uppercase;font-size:11px;font-weight:700;color:#608580}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.btn{border:0;border-radius:12px;padding:13px 16px;background:#126d70;color:white;font-weight:650;min-height:46px}.btn.secondary{background:#e9f2f0;color:#17585b}.btn.ghost{background:transparent;color:#126d70}.btn.danger{background:#fceceb;color:#a23c37}.btn:disabled{opacity:.45}.deck{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;border:1px solid #e1ece8;background:#fff;border-radius:15px;padding:17px}.deck strong{font-size:17px}.deck span{color:#6e8584;font-size:13px}.pill{display:inline-block;border-radius:99px;background:#e9f2f0;color:#24696a;padding:5px 10px;font-size:12px}.card{width:100%;min-height:275px;background:linear-gradient(150deg,#fff,#edf7f3);border:1px solid #d6e8e2;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;box-shadow:0 12px 24px #0c474615;text-align:center}.arabic{font-family:"Geeza Pro","Noto Naskh Arabic","Traditional Arabic",serif;font-size:clamp(34px,8vw,5 </style></head><body><header><div class="wrap"><div><h1>العَرَبِيَّةُ <span style="font-size:15px">· Карточки</span></h1><small>Учимся каждый день</small></div><button class="btn secondary" id="homeBtn" aria-label="На главную">⌂ Главная</button></div></header><main id="app"></main><div id="toast" role="status"></div><script src="app.js" defer></script></body></html>
